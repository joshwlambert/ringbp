# Re-knit precompiled vignettes (`vignettes/*.Rmd.orig` -> `vignettes/*.Rmd`).
#
# Reproduce locally by running (from the package root, with the development
# version of ringbp installed):
# ```r
# source("vignettes/precompile.R")
# ```
name: render-vignettes

# Controls when the action will run. Triggers include:
#
# - button trigger from github action page
# - on changes to DESCRIPTION (including version bumps before a release) or a
#   precompiled vignette source (`vignettes/*.Rmd.orig`) or the precompile
#   script (`vignettes/precompile.R`)
#
# On any branch the vignettes are re-knitted, so the workflow fails if a
# vignette no longer knits. On main, a PR is opened if the output has changed.

on:
  workflow_dispatch:
  push:
    paths:
      - 'DESCRIPTION'
      - 'vignettes/*.Rmd.orig'
      - 'vignettes/precompile.R'
      - '.github/workflows/render-vignettes.yaml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-vignettes:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # app token so that the PR opened by this workflow triggers the other
      # workflows (e.g. R-CMD-check)
      - name: Generate token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repos
        uses: actions/checkout@v7
        with:
          token: ${{ steps.generate_token.outputs.token }}

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::knitr, local::.

      - name: Render precompiled vignettes
        run: source("vignettes/precompile.R")
        shell: Rscript {0}

      - name: Upload vignettes as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: vignettes
          path: vignettes

      - name: Create Pull Request
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "Automatic precompiled vignette update"
          title: "Update precompiled vignettes"
          body: "This is an automated pull request to update the precompiled vignettes (`vignettes/*.Rmd.orig` -> `vignettes/*.Rmd`)."
          branch: "update-vignettes-${{ github.run_number }}"
          labels: "documentation"
          add-paths: |
            vignettes
          token: ${{ steps.generate_token.outputs.token }}
